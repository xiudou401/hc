<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>max-width vs width+max-width</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        gap: 20px;
      }
      .box {
        background: lightcoral;
        color: white;
        padding: 20px;
      }
      /* 情况一：只写 max-width */
      .max {
        max-width: 1200px;
        margin: 0 auto;
      }
      /* 情况二：写 width + max-width */
      .width {
        width: 1200px;
        max-width: 100%;
        margin: 0 auto;
        background: lightseagreen;
      }
    </style>
  </head>
  <body>
    <div class="box max">max-width: 1200px</div>
    <div class="box width">width: 1200px; max-width: 100%</div>
  </body>
</html>
